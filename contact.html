<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me - Safiya Elmi</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>
    <a href="index.html" class="name">Safiya Elmi</a>
    <nav class="navbar">
        <a href="index.html">Home Page</a> 
        <a href="about.html">About Me</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact Me</a>
    </nav>
</header>

<section id="contact" class="contact-form container">
    <h2>Contact <span>Me</span></h2>

    <form id="contactForm" action="main.php" method="POST">
        <div>
            <input type="text" name="name" id="name" placeholder="Full Name" required>
            <input type="email" name="email" id="email" placeholder="Email" required>
            <input type="tel" name="phone" id="phone" placeholder="000 000 0000" required>
            <input type="text" name="subject" id="subject" placeholder="Subject" required>
        </div>

        <textarea name="message" id="message" cols="30" rows="10" placeholder="Your Message" required></textarea>

        <input type="submit" value="Send Message" class="btn-1">
    </form>
</section>

<footer class="footer">
    <p class="copyright">2024 Safiya | All Rights Reserved</p>
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let subject = document.getElementById("subject").value;
    let message = document.getElementById("message").value;

    if (!name || !email || !phone || !subject || !message) {
        e.preventDefault();
        alert("Please fill in all fields before submitting.");
        return;
    }

    if (!email.includes("@")) {
        e.preventDefault();
        alert("Please enter a valid email address.");
        return;
    }

    alert("Message sent successfully!");
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
